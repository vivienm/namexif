name: "CI"

on:
  push:
  pull_request:

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  just:
    name: "Just"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v6"
      - name: "Install the Rust toolchain"
        uses: "dtolnay/rust-toolchain@stable"
        with:
          components: "clippy, rustfmt"
      - name: "Install sccache"
        uses: "mozilla-actions/sccache-action@v0.0.10"
      - name: "Install development tools"
        uses: "taiki-e/install-action@v2"
        with:
          tool: "just, cargo-audit, typos"
      - name: "Cache Cargo directories"
        uses: "actions/cache@v5"
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/advisory-db/
            target/
          key: "${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}"
          restore-keys: "${{ runner.os }}-cargo-"
      - name: "Prepare case-insensitive test directory"
        run: |
          image="${{ runner.temp }}/casefold.img"
          mountpoint="${{ runner.temp }}/casefold"
          truncate -s 64M "$image"
          mkfs.ext4 -q -O casefold "$image"
          mkdir "$mountpoint"
          sudo mount -o loop "$image" "$mountpoint"
          sudo mkdir "$mountpoint/tests"
          sudo chown "$(id -u):$(id -g)" "$mountpoint/tests"
          chattr +F "$mountpoint/tests"
          echo "NAMEXIF_CASE_INSENSITIVE_DIR=$mountpoint/tests" >> "$GITHUB_ENV"
      - name: "Run Just"
        run: "just ci"
        env:
          RUSTC_WRAPPER: "sccache"
          SCCACHE_GHA_ENABLED: "true"
          RUSTFLAGS: "-D warnings"
          RUSTDOCFLAGS: "-D warnings"
      - name: "Unmount test filesystem"
        if: always()
        run: |
          mountpoint="${{ runner.temp }}/casefold"
          if mountpoint -q "$mountpoint"; then
            sudo umount "$mountpoint"
          fi
