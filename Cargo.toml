[package]
name = "namexif"
version = "0.1.0"
edition = "2024"
description = "Rename photos according to their EXIF date tag"
repository = "https://github.com/vivienm/namexif"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["cargo", "derive", "env"] }
clap_complete = "4.6.5"
derive_more = { version = "2.1.1", features = ["display", "error", "from"] }
jiff = "0.2.24"
kamadak-exif = "0.6.1"
lscolors = "0.21.0"
nominal = { git = "https://github.com/vivienm/rust-nominal", version = "0.1.0", features = ["ansi", "confirm", "unicode"] }
rayon = "1.12.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
